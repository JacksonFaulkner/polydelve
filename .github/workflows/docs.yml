name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'backend/models/models.py'
      - 'scripts/extract_models.py'
      - '.github/workflows/docs.yml'
      - 'frontend/src/**'
      - 'scripts/upload-docs-screenshots.sh'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Captures current-UI stills with Playwright against the vite dev server (reads proxy to prod API).
  # History shots are static; run `npm run history` locally once. Any failed capture fails the job
  # before upload, so the bucket keeps the last good images.
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            docs/animation/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install animation deps
        working-directory: docs/animation
        run: npm ci

      - name: Install Chromium
        working-directory: docs/animation
        run: npx playwright-core install --with-deps chromium

      - name: Start frontend
        working-directory: frontend
        env:
          VITE_SKIP_AUTH: 'true'
          VITE_API_URL: /api
        run: |
          nohup npx vite --port 5180 > /tmp/vite.log 2>&1 &
          npx --yes wait-on http://localhost:5180 --timeout 60000

      - name: Capture screenshots
        working-directory: docs/animation
        run: npm run screenshots

      - name: Fail on failed captures
        run: |
          if ls docs/animation/out/docs/*FAILED* >/dev/null 2>&1; then
            echo "failed captures:"; ls docs/animation/out/docs/*FAILED*; exit 1
          fi

      - name: Upload screenshots to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_ASSETS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_ASSETS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: scripts/upload-docs-screenshots.sh

      - name: Vite log on failure
        if: failure()
        run: cat /tmp/vite.log || true

  sync-assets:
    needs: screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync docs/public to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_ASSETS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_ASSETS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws s3 sync docs/public s3://polydelve-assets \
            --cache-control "max-age=31536000,public" \
            --exclude "*.html"

  build:
    needs: sync-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Extract Pydantic models
        run: python3 scripts/extract_models.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install deps
        working-directory: docs
        run: npm ci

      - name: Build
        working-directory: docs
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
